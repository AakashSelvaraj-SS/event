{% extends 'base.html' %}

{% block title %}Login - AI Document Extractor{% endblock %}

{% block auth_content %}
<div class="card border-0 shadow-lg rounded-4 overflow-hidden">
    <div class="card-header bg-slate text-white text-center p-4 border-0">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-25 rounded-circle p-3 mb-2">
            <i class="bi bi-file-earmark-spreadsheet-fill fs-1 text-primary-light"></i>
        </div>
        <h4 class="fw-bold mb-1">AI Document Extractor</h4>
        <p class="text-white-50 fs-sm mb-0">Academic & Document Processing Suite</p>
    </div>

    <div class="card-body p-4 p-md-5 bg-white">
        <h5 class="fw-bold text-dark mb-3 text-center">Sign In to Your Workspace</h5>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label fs-sm fw-medium text-secondary">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label fs-sm fw-medium text-secondary">Password</label>
                    <a href="#" class="fs-xs text-decoration-none text-primary" onclick="alert('For academic demonstration, please register a new user or use your existing account.'); return false;">Forgot password?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-xs">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center fs-sm text-secondary">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Register Now</a>
        </div>
    </div>
</div>
{% endblock %}
