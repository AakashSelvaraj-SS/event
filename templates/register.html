{% extends 'base.html' %}

{% block title %}Register - AI Document Extractor{% endblock %}

{% block auth_content %}
<div class="card border-0 shadow-lg rounded-4 overflow-hidden">
    <div class="card-header bg-slate text-white text-center p-4 border-0">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-25 rounded-circle p-3 mb-2">
            <i class="bi bi-person-plus-fill fs-1 text-primary-light"></i>
        </div>
        <h4 class="fw-bold mb-1">Create Account</h4>
        <p class="text-white-50 fs-sm mb-0">Join the AI Document Extraction Platform</p>
    </div>

    <div class="card-body p-4 p-md-5 bg-white">
        <form action="{{ url_for('register') }}" method="POST">
            <div class="mb-3">
                <label for="full_name" class="form-label fs-sm fw-medium text-secondary">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-card-text"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="full_name" name="full_name" placeholder="e.g. Rahul Sharma" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fs-sm fw-medium text-secondary">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="name@domain.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label fs-sm fw-medium text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Choose a unique username" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fs-sm fw-medium text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="At least 6 characters" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label fs-sm fw-medium text-secondary">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-xs">
                <i class="bi bi-person-check me-1"></i> Register Account
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center fs-sm text-secondary">
            Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
